services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    hostname: clickhouse
    ports:
      - "8123:8123"
      - "9002:9002" 
    volumes:
      - clickhouse_data:/var/lib/clickhouse  
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - shared
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin

networks:
  shared:
    external: true
    name: Carry-inter-network

volumes:
  clickhouse_data: