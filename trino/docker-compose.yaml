services:
  # 1. PostgreSQL (Catalog) for iceberg
  postgres-iceberg:
    image: postgres:15
    container_name: postgres-iceberg
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    ports:
      - "1235:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg_catalog"]

  # 2. MinIO (Storage) for iceberg
  minio-iceberg:
    image: minio/minio
    container_name: minio-iceberg
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  # 3. Trino 
  trino-coordinator:
    image: trinodb/trino
    container_name: trino-coordinator
    depends_on:
      postgres-iceberg:
        condition: service_healthy
    ports:
      - "8081:8080"
    volumes:
      - ./coordinator/config.properties:/etc/trino/config.properties
      - ./catalog:/etc/trino/catalog

  trino-worker-1:
    image: trinodb/trino
    container_name: trino-worker-1
    volumes:
      - ./worker/config.properties:/etc/trino/config.properties
      - ./catalog:/etc/trino/catalog
    depends_on:
      - trino-coordinator

  trino-worker-2:
    image: trinodb/trino
    container_name: trino-worker-2
    volumes:
      - ./worker/config.properties:/etc/trino/config.properties
      - ./catalog:/etc/trino/catalog
    depends_on:
      - trino-coordinator