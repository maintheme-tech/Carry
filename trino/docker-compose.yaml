services:
  # 1. PostgreSQL (Catalog) for iceberg
  postgres-iceberg:
    image: postgres:15
    container_name: postgres-iceberg
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    networks:
      - default
      - shared
    ports:
      - "5431:5432"

  # 2. Silo (Storage) for iceberg
  silo-iceberg:
    image: pgsty/silo:latest
    container_name: silo-iceberg
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: 
      - ./silo_persistent_data:/data
    command: server /data --console-address ":9001"
    networks:
      - default
      - shared
    ports:
      - "9000:9000"
      - "9001:9001"

  # 3. Trino 
  trino-coordinator:
    image: trinodb/trino
    container_name: trino-coordinator
    volumes:
      - ./coordinator/config.properties:/etc/trino/config.properties
      - ./catalog:/etc/trino/catalog
    networks:
      - default
      - shared
    ports:
      - "8081:8080"
    depends_on:
      - postgres-iceberg



  trino-worker-1:
    image: trinodb/trino
    container_name: trino-worker-1
    volumes:
      - ./worker/config.properties:/etc/trino/config.properties
      - ./catalog:/etc/trino/catalog
    depends_on:
      - trino-coordinator
    networks:
      - default
      - shared

  trino-worker-2:
    image: trinodb/trino
    container_name: trino-worker-2
    volumes:
      - ./worker/config.properties:/etc/trino/config.properties
      - ./catalog:/etc/trino/catalog
    depends_on:
      - trino-coordinator
    networks:
      - default
      - shared

networks:
  default:
  shared:
    external: true
    name: Carry-inter-network